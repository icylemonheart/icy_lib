plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_mc
        mappingsVersion = parchment_version
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories {
    // NeoForged maven 的国内镜像（BMCLAPI -> CERNET），官方 maven.neoforged.net 被墙时兜底
    maven {
        url = 'https://bmclapi2.bangbang93.com/maven'
        content { includeGroup 'net.neoforged' }
    }
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Mixin annotation processor (runtime Mixin comes bundled with NeoForge)
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

// NeoForge 1.21.1 is Mojang-mapped at runtime; tell the Mixin AP not to remap the refmap.
// The AP still needs an output path so it can write the (mostly empty) refmap, which is
// included in the jar for older NeoForge loaders.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-AoutrefmapFile=${layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json").get().asFile.absolutePath}".toString(),
        "-AdefaultObfuscationEnv=searge",
        "-AreobfSrgFile="
    ]
    options.forkOptions.jvmArgs += "-Dmixin.env.remapRefMap=false"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neoforge_version: neoforge_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    // Include the (mostly empty) refmap produced by the Mixin annotation processor
    from(layout.buildDirectory.dir("tmp/compileJava")) {
        include "${mod_id}.refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
